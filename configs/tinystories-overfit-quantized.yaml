run:
  name: tinystories-overfit-quantized
  mode: ncp
  output_dir: ${NCP_ROOT}/runs/tinystories-overfit-quantized
  seed: 17
  resume: true

model:
  base_model: HuggingFaceTB/SmolLM2-135M
  revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
  chunk_size: 4
  segments: 9
  codebook_size: 64
  concept_layers: 2
  insert_layer: 1
  ncp_target: quantized
  ncp_weight: 1.0
  vq_weight: 1.0
  dtype: bfloat16

data:
  dataset: roneneldan/TinyStories
  subset: null
  revision: f54c09fd23315a6f9c86f9dc80f725de7d8f9c64
  train_split: train
  validation_split: validation
  text_column: text
  cache_dir: ${NCP_ROOT}/.cache/data/tinystories-overfit
  sequence_length: 256
  train_tokens: 16777216
  cache_train_tokens: 1048576
  validation_tokens: 1048576
  shuffle_buffer: 2000
  overfit: true

optim:
  learning_rate: 0.00003
  min_lr_ratio: 0.1
  warmup_ratio: 0.01
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  micro_batch_size: 4
  grad_accum_steps: 4
  max_grad_norm: 1.0

train:
  log_every_steps: 10
  eval_every_tokens: 4194304
  save_every_tokens: 8388608
  eval_batches: 16
  max_wall_time_minutes: 180
  hourly_cost_usd: 1.44
  run_budget_usd: 6.0
  compile: false
